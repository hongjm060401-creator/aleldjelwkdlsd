<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미드나잇 라이브러리 | 나만의 후회 보관소</title>
    <style>
        /* 기본 스타일 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b071e; /* 베이스 밤하늘색 */
            
            /* [수정] 블러 필터 대신 안전한 CSS 그라데이션 조합으로 몽환적인 배경 구현 */
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(164, 109, 254, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(116, 160, 251, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(100, 193, 244, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 10% 80%, rgba(205, 147, 254, 0.3) 0%, transparent 50%);
            background-attachment: fixed;

            color: #F2DBFF;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 콘텐츠 영역 (유리창 효과) */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 550px;
            padding: 40px 30px;
            background: rgba(15, 10, 35, 0.65); /* 가독성을 위해 배경을 조금 더 어둡게 조절 */
            border: 1px solid rgba(205, 147, 254, 0.25);
            border-radius: 24px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); /* 사파리 브라우저 호환성 */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* 시계 영역 */
        .clock-section {
            margin-bottom: 25px;
        }

        .time {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #F2DBFF;
            text-shadow: 0 0 20px rgba(164, 109, 254, 0.8);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 15px rgba(164, 109, 254, 0.5); }
            100% { text-shadow: 0 0 30px rgba(100, 193, 244, 0.9), 0 0 10px rgba(242, 219, 255, 0.6); }
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 15px;
            font-weight: 400;
            word-break: keep-all;
            line-height: 1.5;
        }

        p.desc {
            font-size: 0.95rem;
            color: #74A0FB;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* 입력창 */
        .input-group {
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(11, 7, 30, 0.8);
            border: 1.5px solid #4891F6;
            border-radius: 12px;
            padding: 15px;
            color: #F2DBFF;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #CD93FE;
            box-shadow: 0 0 15px rgba(205, 147, 254, 0.5);
        }

        textarea::placeholder {
            color: rgba(242, 219, 255, 0.35);
        }

        /* 버튼 */
        .btn-enter {
            background: linear-gradient(135deg, #4891F6, #A46DFE);
            color: #F2DBFF;
            border: none;
            padding: 14px 45px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(72, 145, 246, 0.4);
        }

        .btn-enter:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(164, 109, 254, 0.7);
            background: linear-gradient(135deg, #64C1F4, #CD93FE);
        }

        .hidden {
            display: none;
            opacity: 0;
        }

        .fade-in {
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <div class="clock-section">
            <div class="time" id="digitalClock">11:59</div>
        </div>
        
        <div id="step1">
            <h1>"시간이 멈추는 밤 12시,<br>당신이 가장 후회하는 선택은 무엇인가요?"</h1>
            <p class="desc">마음속 깊이 묻어둔 후회를 적고, 자정의 도서관 문을 열어보세요.</p>
            
            <div class="input-group">
                <textarea id="regretInput" placeholder="예: 그때 그 사람에게 솔직하게 말할 걸 그랬어..."></textarea>
            </div>
            
            <button class="btn-enter" onclick="enterLibrary()">도서관 입장하기</button>
        </div>

        <div id="step2" class="hidden">
            <h1>"그 선택을 바꾼다면,<br>당신의 삶은 정말 더 행복해졌을까요?"</h1>
            <p class="desc" id="userRegretDisplay" style="color: #CD93FE; font-style: italic; font-weight: 600; margin-bottom: 20px; font-size: 1.1rem;"></p>
            <p class="desc" style="margin-bottom: 35px; color: #F2DBFF;">방금 보관된 당신의 후회입니다. 미드나잇 라이브러리에서는 이 후회를 다른 삶으로 바꾸어 살아볼 수 있습니다.</p>
            
            <button class="btn-enter" onclick="alert('다음 인터랙션(책장 넘기기 등)으로 이어지는 구간입니다!')">다른 삶 확인하기</button>
        </div>
    </div>

    <script>
        function enterLibrary() {
            const input = document.getElementById('regretInput').value;
            if(!input.trim()) {
                alert('후회하는 선택을 한 줄 적어주셔야 도서관의 문이 열립니다.');
                return;
            }

            // 시계 변환
            const clock = document.getElementById('digitalClock');
            clock.innerText = "12:00";
            clock.style.color = "#64C1F4";

            // 텍스트 반영
            document.getElementById('userRegretDisplay').innerText = `"${input}"`;

            // 화면 전환
            document.getElementById('step1').style.display = 'none';
            
            const step2 = document.getElementById('step2');
            step2.classList.remove('hidden');
            step2.classList.add('fade-in');
        }
    </script>
</body>
</html>
